services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: logistic
      POSTGRES_PASSWORD: logistic
      POSTGRES_DB: logistic
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistic"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./server
    profiles: ["full"]
    env_file: ./server/.env
    environment:
      DATABASE_URL: postgres://logistic:logistic@db:5432/logistic
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
